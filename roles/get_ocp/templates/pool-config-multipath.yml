apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfigPool
metadata:
  name: multipath
spec:
  machineConfigSelector:
    matchExpressions:
      - {key: machineconfiguration.openshift.io/role, operator: In, values: [worker,multipath]}
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/multipath: ""
  paused: false
