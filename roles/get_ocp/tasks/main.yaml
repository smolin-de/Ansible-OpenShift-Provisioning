---
# TODO
# ~/.kube/config

- name: Create directory bin for mirrors
  tags: get_ocp
  ansible.builtin.file:
    path: /var/www/html/bin
    state: directory
    mode: "0755"
    owner: "root"
    group: "root"

- name: Copy Red Hat CoreOS rootfs image
  tags: get_ocp
  ansible.builtin.shell: |
    wget -N -P /var/www/html/bin/ "{{ rhcos_download_url }}{{ rhcos_live_rootfs }}"
  register: cmd_output
  changed_when: "'saved' in cmd_output.stdout"

- name: Copy Red Hat CoreOS qemu image
  tags: get_ocp
  ansible.builtin.shell: |
    wget -N -P /var/www/html/bin/ "{{ rhcos_download_url }}{{ rhcos_live_qemu }}"
  register: cmd_output
  changed_when: "'saved' in cmd_output.stdout"

- name: Delete OCP download directory for idempotency, because ignition files deprecate after 24 hours.
  tags: get_ocp
  ansible.builtin.file:
    path: /root/ocpinst
    state: absent

- name: Create OCP download directory
  tags: get_ocp
  ansible.builtin.file:
    path: /root/ocpinst
    state: directory
    mode: "0755"
    owner: "root"
    group: "root"

- name: Copy Red Hat CoreOS ISO image
  tags: get_ocp
  ansible.builtin.shell: |
    # curl -sSL -o "/root/ocpinst/rhcos.iso" "{{ rhcos_download_url }}{{ rhcos_live_iso }}"
    wget -N -P /var/www/html/bin/ "{{ rhcos_download_url }}{{ rhcos_live_iso }}"
  register: cmd_output
  changed_when: "'saved' in cmd_output.stdout"

# - name: Unzip OCP client and installer
#   tags: get_ocp
#   ansible.builtin.unarchive:
#     src: "{{ item }}"
#     dest: /root/ocpinst/
#     remote_src: yes
#   loop:
#     - "{{ ocp_download_url }}{{ ocp_client_tgz }}"
#     - "{{ ocp_download_url }}{{ ocp_install_tgz }}"

- name: Unzip OCP client and installer using shell
  tags: get_ocp
  ansible.builtin.shell: |
    set -o pipefail
    cd /root/ocpinst/
    TOOL="openshift-client-linux.tar.gz"
    echo "Download and install $TOOL"
    curl -sSL "{{ ocp_download_url }}../$(uname -m | sed 's/aarch64/arm64/;s/x86_64/amd64/')/${TOOL}" | tar xzf - -C /root/ocpinst/
    TOOL="openshift-install-linux.tar.gz"
    echo "Download and install ${TOOL}"
    curl -sSL "{{ ocp_download_url }}../$(uname -m | sed 's/aarch64/arm64/;s/x86_64/amd64/')/${TOOL}" | tar xzf - -C /root/ocpinst/
  register: cmd_output

- name: Print above cmd output
  tags: get_ocp
  ansible.builtin.debug:
    var: cmd_output

- name: Get latest coreos_installer
  tags: get_ocp
  ansible.builtin.shell: |
    set -o pipefail
    curl -sSL -o "/root/ocpinst/coreos-installer" \
    "https://mirror.openshift.com/pub/openshift-v4/clients/coreos-installer/latest/coreos-installer_$(uname -m | sed 's/aarch64/arm64/;s/x86_64/amd64/')"
    chmod +x /root/ocpinst/coreos-installer
  failed_when: false

- name: Copy kubectl, oc, and openshift-install binaries to /usr/local/sbin
  tags: get_ocp
  become: true
  ansible.builtin.copy:
    src: /root/ocpinst/{{ item }}
    dest: /usr/sbin/{{ item }}
    owner: root
    group: root
    mode: "755"
    remote_src: yes
  loop:
    - kubectl
    - oc
    - openshift-install

- name: Use template file to create install-config and backup
  tags: get_ocp
  vars:
    use_proxy: "{{ 'True' if (proxy_env.http_proxy is defined or proxy_env.https_proxy is defined or proxy_env.no_proxy is defined) else 'False' }}"
  ansible.builtin.template:
    src: install-config.yaml.j2
    dest: "{{ item }}"
    mode: "0644"
    force: yes
  loop:
    - /root/ocpinst/install-config.yaml
    - /root/ocpinst/install-config-backup.yaml

- name: Capture OCP public key
  tags: get_ocp
  ansible.builtin.command: cat /root/.ssh/id_rsa.pub
  register: ocp_pub_key

- name: Place SSH key in install-config
  tags: get_ocp
  ansible.builtin.lineinfile:
    line: "sshKey: '{{ ocp_pub_key.stdout }}'"
    path: "{{ item }}"
  loop:
    - /root/ocpinst/install-config.yaml
    - /root/ocpinst/install-config-backup.yaml

- name: Create manifests
  tags: get_ocp
  ansible.builtin.shell: |
    set -o pipefail
    /root/ocpinst/openshift-install create manifests --dir=/root/ocpinst/

- name: Set masters schedulable parameter to false, when compute nodes defined
  tags: get_ocp
  ansible.builtin.replace:
    path: /root/ocpinst/manifests/cluster-scheduler-02-config.yml
    regexp: ": true"
    replace: ": false"
  when: (env.cluster.nodes.compute.hostname | default('')) | length > 0

- name: Add machine config files for control and compute, if defined
  tags: get_ocp
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/root/ocpinst/manifests/{{ item }}"
    mode: "0644"
  loop: "{{ (env.cluster.nodes.control.mc | default([])) + (env.cluster.nodes.compute.mc | default([])) }}"
  when:
    - env.cluster.nodes.control.mc is defined or env.cluster.nodes.compute.mc is defined

- name: List the files in the manifests directory
  tags: get_ocp
  ansible.builtin.command: "ls -lrt /root/ocpinst/manifests/"
  register: cmd_output

- name: Print above cmd output
  ansible.builtin.debug:
    var: cmd_output.stdout_lines

- name: Backup manifests directory
  tags: get_ocp
  ansible.builtin.command:
    cmd: cp -a /root/ocpinst/manifests /root/ocpinst/manifests.bak

- name: Lood SNO config tasks
  when: (env.cluster.nodes.control.hostname | default('') | length) == 1
  ansible.builtin.include_tasks: "sno_cluster.yaml"

- name: Lood default cluster config tasks
  when: (env.cluster.nodes.control.hostname | default('') | length) != 1
  ansible.builtin.include_tasks: "default_cluster.yaml"
