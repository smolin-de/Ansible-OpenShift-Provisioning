---
- name: Delete OCP download directory for idempotency, because ignition files deprecate after 24 hours.
  tags: get_ocp
  become: true
  ansible.builtin.file:
    path: /root/ocpinst
    state: absent

- name: Delete ignition folder for idempotency
  tags: get_ocp
  ansible.builtin.file:
    path: /var/www/html/ignition
    state: absent

- name: Create directory bin for mirrors
  tags: get_ocp
  become: true
  ansible.builtin.file:
    path: /var/www/html/bin
    state: directory
    mode: "0755"
    owner: "root"
    group: "root"

- name: Create OCP download directory
  tags: get_ocp
  ansible.builtin.file:
    path: /root/ocpinst
    state: directory
    mode: "0755"

# Replaced with legacy wget cmd, because it is not supported anymore on our Jenkins server
# # Required rootfs image, when use KVM bootstrap or other kVM node
# - name: Copy Red Hat CoreOS rootfs file to bastion, if it's not there already.
#   tags: get_ocp
#   get_url:
#     url: "{{ rhcos_download_url }}{{ rhcos_live_rootfs }}"
#     dest: "/var/www/html/bin/{{ rhcos_live_rootfs }}"
#     mode: "0644"

# - name: Copy Red Hat CoreOS qemu image file to bastion, if it's not there already.
#   tags: get_ocp
#   get_url:
#     url: "{{ rhcos_download_url }}{{ rhcos_live_qemu }}"
#     dest: "/var/www/html/bin/{{ rhcos_live_qemu }}"
#     mode: "0644"

- name: Copy Red Hat CoreOS rootfs image
  tags: get_ocp
  ansible.builtin.shell: |
    #curl -sS -L -o "/var/www/html/bin/{{ rhcos_live_rootfs }}" "{{ rhcos_download_url }}{{ rhcos_live_rootfs }}"
    wget -N -P /var/www/html/bin/ "{{ rhcos_download_url }}{{ rhcos_live_rootfs }}"
  register: cmd_output

- name: Print above cmd output
  tags: get_ocp
  ansible.builtin.debug:
    var: cmd_output.stdout_lines

- name: Copy Red Hat CoreOS qemu image
  tags: get_ocp
  ansible.builtin.shell: |
    # curl -sS -L -o "/var/www/html/bin/{{ rhcos_live_qemu }}" "{{ rhcos_download_url }}{{ rhcos_live_qemu }}"
    wget -N -P /var/www/html/bin/ "{{ rhcos_download_url }}{{ rhcos_live_qemu }}"
  register: cmd_output

- name: Print above cmd output
  tags: get_ocp
  ansible.builtin.debug:
    var: cmd_output.stdout_lines

- name: Copy Red Hat CoreOS ISO image
  tags: get_ocp
  ansible.builtin.shell: |
    # curl -sSL -o "/root/ocpinst/rhcos.iso" "{{ rhcos_download_url }}{{ rhcos_live_iso }}"
    wget -N -P /var/www/html/bin/ "{{ rhcos_download_url }}{{ rhcos_live_iso }}"
  register: cmd_output

- name: Print above cmd output
  tags: get_ocp
  ansible.builtin.debug:
    var: cmd_output.stdout_lines

# - name: Unzip OCP client and installer
#   tags: get_ocp
#   ansible.builtin.unarchive:
#     src: "{{ item }}"
#     dest: /root/ocpinst/
#     remote_src: yes
#   loop:
#     - "{{ ocp_download_url }}{{ ocp_client_tgz }}"
#     - "{{ ocp_download_url }}{{ ocp_install_tgz }}"

- name: Unzip OCP client and installer using shell
  tags: get_ocp
  ansible.builtin.shell: |
    set -o pipefail
    cd /root/ocpinst/
    TOOL="openshift-client-linux-$(uname -m | sed 's/aarch64/arm64/;s/x86_64/amd64/').tar.gz"
    echo "Download and install $TOOL"
    curl -sSL "{{ ocp_download_url }}${TOOL}" | tar xzf - -C /root/ocpinst/
    TOOL="openshift-install-linux-$(uname -m | sed 's/aarch64/arm64/;s/x86_64/amd64/').tar.gz"
    echo "Download and install ${TOOL}"
    curl -sSL "{{ ocp_download_url }}${TOOL}" | tar xzf - -C /root/ocpinst/
  register: cmd_output

- name: Print above cmd output
  tags: get_ocp
  ansible.builtin.debug:
    var: cmd_output

- name: Get latest coreos_installer
  tags: get_ocp
  ansible.builtin.shell: |
    set -o pipefail
    curl -sSL -o "/root/ocpinst/coreos-installer" \
    "https://mirror.openshift.com/pub/openshift-v4/clients/coreos-installer/latest/coreos-installer_$(uname -m | sed 's/aarch64/arm64/;s/x86_64/amd64/')"
    chmod +x /root/ocpinst/coreos-installer
  failed_when: false
  register: cmd_output

- name: Print above cmd output
  tags: get_ocp
  ansible.builtin.debug:
    var: cmd_output

- name: Copy kubectl, oc, and openshift-install binaries to /usr/local/sbin
  tags: get_ocp
  become: true
  ansible.builtin.copy:
    src: /root/ocpinst/{{ item }}
    dest: /usr/sbin/{{ item }}
    owner: root
    group: root
    mode: "755"
    remote_src: yes
  loop:
    - kubectl
    - oc
    - openshift-install

- name: Capture OCP public key
  tags: get_ocp
  ansible.builtin.command: cat /root/.ssh/id_rsa.pub
  register: ocp_pub_key

- name: Use template file to create install-config and backup.
  tags: get_ocp
  vars:
    use_proxy: "{{ 'True' if (proxy_env.http_proxy is defined or proxy_env.https_proxy is defined or proxy_env.no_proxy is defined) else 'False' }}"
  ansible.builtin.template:
    src: install-config.yaml.j2
    dest: "{{ item }}"
    mode: "0644"
    force: yes
  loop:
    - /root/ocpinst/install-config.yaml
    - /root/ocpinst/install-config-backup.yaml

- name: Place SSH key in install-config
  tags: get_ocp
  ansible.builtin.lineinfile:
    line: "sshKey: '{{ ocp_pub_key.stdout }}'"
    path: "{{ item }}"
  loop:
    - /root/ocpinst/install-config.yaml
    - /root/ocpinst/install-config-backup.yaml

