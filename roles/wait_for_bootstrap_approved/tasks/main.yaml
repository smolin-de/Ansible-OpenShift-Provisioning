---

- name: "Wait for first node-bootstrapper request. Takes < 10 min with good network connection (retry every 60s)...To watch progress, SSH to root@bastion, SSH to core@bootstrap-ip and run 'journalctl -b -f -u release-image.service -u bootkube.service'"
  tags: wait_for_bootstrap
  ansible.builtin.shell: |
    set -o pipefail
    oc get csr | grep ":node-bootstrapper"
  register: csr_check
  until: (":node-bootstrapper" in csr_check.stdout)
  retries: 30
  delay: 60

- name: Print first node-bootstrapper requests
  tags: wait_for_bootstrap
  ansible.builtin.debug:
    var: csr_check.stdout_lines
