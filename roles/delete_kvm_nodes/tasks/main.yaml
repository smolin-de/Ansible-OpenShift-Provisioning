---

- name: Delete bootstrap, control and compute nodes, if exists
  tags: delete_nodes
  vars:
    meta_name: "{{ env.cluster.networking.metadata_name }}"
    pool_name: "{{ meta_name }}-vdisk"
  ansible.builtin.shell: |
    virsh destroy "{{ item }}" 2>/dev/null || true
    virsh undefine "{{ item }}" --remove-all-storage --nvram 2>/dev/null || true

    VOLUMES=$(virsh vol-list {{ pool_name }} | awk '/^ {{ item }}/ {print $1}')
    for vol in $VOLUMES; do
      virsh vol-delete --pool {{ pool_name }} "$vol"
    done
  loop: "{{ ([env.cluster.nodes.bootstrap.vm_name | default()] + \
          (env.cluster.nodes.control.vm_name | default([])) + \
          (env.cluster.nodes.compute.vm_name | default([]))) | select() }}"
  register: delete_nodes
  changed_when: "('destroyed' in delete_nodes.stdout) or ('undefined' in delete_nodes.stdout)"

- name: Get and print virsh list
  tags: delete_nodes
  block:
    - name: Get virsh list
      ansible.builtin.command: virsh list
      register: cmd_virsh_list

    - name: Print virsh list
      ansible.builtin.debug:
        var: cmd_virsh_list.stdout_lines

- name: Get and print virsh image list
  tags: delete_nodes
  block:
    - name: Get virsh image list
      ansible.builtin.shell: |
        META="{{ env.cluster.networking.metadata_name }}"
        virsh vol-list "${META}-vdisk" 2> /dev/null || true
      register: cmd_virsh_image_list

    - name: Print virsh image list
      ansible.builtin.debug:
        var: cmd_virsh_image_list.stdout_lines
