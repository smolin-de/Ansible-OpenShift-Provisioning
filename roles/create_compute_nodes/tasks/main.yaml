    --autostart \
    --disk pool={{ env.cluster.networking.metadata_name }}-vdisk,size={{ env.cluster.nodes.infra.disk_size }},cache=none,io=native \
    {% if env.cluster.nodes.infra.disk2_size is defined %}
    --disk pool={{ env.cluster.networking.metadata_name }}-vdisk,size={{ env.cluster.nodes.infra.disk2_size }},cache=none,io=native \
