---
- name: Get and print nodes status
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/print_ocp_node_status.yaml"

- name: Make sure all control and all compute nodes are 'Ready' or 'NotReady' before continuing (retry every 30s)
  tags: check_nodes
  ansible.builtin.shell: |
    set -o pipefail
    oc get nodes | grep "^{{ node | lower }}" | awk '{print $2}'
  loop: "{{ env.cluster.nodes.control.hostname + (env.cluster.nodes.compute.hostname | default([])) }}"
  loop_control:
    loop_var: node
  register: cmd_output
  changed_when: false
  until: ("Ready" == cmd_output.stdout) or ("NotReady" == cmd_output.stdout)
  retries: 30
  delay: 30
  failed_when: false


