- name: Create storage pool, if not exists
  tags: configure_storage, pool
  block:
    - name: Create storage pool, if not exists
      ansible.builtin.shell: |
        set -o pipefail
        NAME="{{ env.cluster.networking.metadata_name }}"
        if ! virsh pool-list | grep -q "^ ${NAME}-vdisk." ; then
          virsh pool-define-as ${NAME}-vdisk dir - - - - "/var/lib/libvirt/images/${NAME}"
          virsh pool-build ${NAME}-vdisk
          virsh pool-start ${NAME}-vdisk
          virsh pool-autostart ${NAME}-vdisk
          virsh pool-list
        fi
      register: cmd_output

    - name: Print above cmd output
      when: ("Pool " in cmd_output.stdout_lines | join)
      ansible.builtin.debug:
        var: cmd_output.stdout_lines

