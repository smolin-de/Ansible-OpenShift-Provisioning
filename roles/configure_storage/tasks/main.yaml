---
- name: Create directory in <storage.pool_path> for this cluster's storage pool.
  tags: configure_storage, pool
  ansible.builtin.file:
    path: "{{ storage.pool_path }}/{{ env.cluster.networking.metadata_name }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: qemu
    seuser: system_u
    setype: virt_image_t
    mode: '0770'
    recurse: true

