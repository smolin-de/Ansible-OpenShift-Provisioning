---

- name: Check role/task parameters
  ansible.builtin.fail:
    msg: "Error: loop control variable 'idx' is not defined"
  when: idx is not defined

- name: Include LPAR host variablese
  ansible.builtin.include_vars:
    file: "{{ inventory_dir }}/host_vars/{{ parm_lpar_names[idx] }}.yaml"
    name: _host

- name: Update local variable
  ansible.builtin.set_fact:
    _hmc_load_from_ftp_ins_file: "{{ env.hmc_ftp_server.dir }}{{ _host.lpar.name }}.ins"

- name: Create required directories on HMC ftp server, if not already exists
  when: idx == 0
  ansible.builtin.shell: |
    mkdir -p "{{ env.file_server.ftp_dir }}iso"
    mkdir -p "{{ env.file_server.ftp_dir }}images"
  remote_user: "{{ env.file_server.user }}"
  delegate_to: "{{ env.file_server.ip }}"

- name: If not available, download Red Hat CoreOS ISO to HMC ftp server
  when: idx == 0
  ansible.builtin.get_url:
    url: "{{ item.baseurl }}{{ item.file }}"
    dest: "{{ env.file_server.ftp_dir }}iso/{{ item.file }}"
    mode: "0644"
  loop:
    - { baseurl: "{{ rhcos_download_url }}", file: "{{ rhcos_live_iso }}" }
  remote_user: "{{ env.file_server.user }}"
  delegate_to: "{{ env.file_server.ip }}"

# TODO: For legacy reasons, can be deleted in future
# - name: Create and upload lagacy prm file
#   when: parm_lpar_prm_filenames[idx] is defined
#   ansible.builtin.copy:
#     dest: "{{ parm_lpar_prm_filenames[idx] }}"
#     content: "{{ (_host.lpar_prm_config1 | join(' ') + ' ' + parm_lpar_prm_configs2[idx]) + '\n' }}"
#     mode: '0644'
#   remote_user: "{{ env.z.hmc_ftp_server.user }}"
#   delegate_to: "{{ env.z.hmc_ftp_server.ip }}"

- name: Extract boot artifacts from ISO, e.g. {{ rhcos_live_kernel }}"
  when: idx == 0
  ansible.builtin.shell: |
    set -e
    cd "{{ env.file_server.ftp_dir }}images"
    7z e "../iso/{{ rhcos_live_iso }}" -so images/pxeboot/kernel.img > "{{ rhcos_live_kernel }}"
    7z e "../iso/{{ rhcos_live_iso }}" -so images/pxeboot/initrd.img > "{{ rhcos_live_initrd }}"
    7z e "../iso/{{ rhcos_live_iso }}" -so images/initrd.addrsize > "{{ rhcos_live_initrd }}.addrsize"
  remote_user: "{{ env.file_server.user }}"
  delegate_to: "{{ env.file_server.ip }}"

