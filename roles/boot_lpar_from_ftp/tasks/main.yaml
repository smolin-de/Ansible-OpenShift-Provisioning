- name: Create and upload prm file
  ansible.builtin.copy:
    dest: "{{ env.file_server.ftp_dir }}images/{{ _host.lpar.name }}.prm"
    content: "{{ (_host.lpar_prm_config1 | join(' ') + ' ' + parm_lpar_prm_configs2[idx]) + '\n' }}"
    mode: '0644'
  remote_user: "{{ env.file_server.user }}"
  delegate_to: "{{ env.file_server.ip }}"

- debug:
    var: _host.lpar_prm_config1

- name: Create and upload ins file from template
  ansible.builtin.template:
    src: "lpar_ins.j2"
    dest: "{{ env.file_server.ftp_dir }}{{ _host.lpar.name }}.ins"
    mode: "0644"
  remote_user: "{{ env.file_server.user }}"
  delegate_to: "{{ env.file_server.ip }}"

# TODO: For legacy reasons, can be deleted in future
