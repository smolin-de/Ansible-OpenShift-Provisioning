# Prepare and then create the temporary bootstrap node and the control nodes
- name: 6 create nodes - prepare KVM guests
  hosts: kvm_host
  gather_facts: false
  roles:
    # Delete control, compute and infra nodes, if exists
    - delete_kvm_nodes

- name: 6 create nodes - Stop LPARs, if running in dpm mode
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Stop bootstrap node LPARs, if running in dpm mode
      when: (env.cluster.nodes.bootstrap.lpar_name | default('')) | length > 0
      ansible.builtin.include_role:
        name: stop_lpar_partition
      loop: "{{ env.cluster.nodes.bootstrap.lpar_name }}"
      loop_control:
        loop_var: lpar_name

    - name: Stop control node LPARs, if running in dpm mode
      when: (env.cluster.nodes.control.lpar_name | default('')) | length > 0
      ansible.builtin.include_role:
        name: stop_lpar_partition
      loop: "{{ env.cluster.nodes.control.lpar_name }}"
      loop_control:
        loop_var: lpar_name

    - name: Stop compute node LPARs, if running in dpm mode
      when: (env.cluster.nodes.compute.lpar_name | default('')) | length > 0
      ansible.builtin.include_role:
        name: stop_lpar_partition
      loop: "{{ env.cluster.nodes.compute.lpar_name }}"
      loop_control:
        loop_var: lpar_name

    # - name: Stop all cluster node LPARs
    #   include_role:
    #     name: stop_lpar_partition
    #   loop: >-
    #     {{
    #       (env.cluster.nodes.bootstrap.lpar_name | default([])) +
    #       (env.cluster.nodes.control.lpar_name | default([])) +
    #       (env.cluster.nodes.compute.lpar_name | default([]))
    #     }}
    #   loop_control:
    #     loop_var: lpar_name
    #   when: lpar_name is defined

- name: 6 create nodes - create bootstrap KVM node
  hosts: kvm_host_bootstrap
  gather_facts: false
  roles:
    - common
    - role: create_bootstrap
      when: env.cluster.nodes.bootstrap.vm_name[0] is defined

- name: 6 create nodes - bootstrap and control ( if in lpar )
  hosts: bastion
  become: true
  tasks:
    - name: boot bootstrap
      vars:
        node_type: "bootstrap"
        node_name: "{{ item }}"
        ignition: "bootstrap"
      ansible.builtin.include_tasks:
        file: ../roles/boot_LPAR/tasks/main.yaml
      loop: "{{ q('list', env.cluster.nodes[node_type].vm_name) | flatten }}"
      # Disabled function
      when: 0

    - name: boot control nodes
      vars:
        node_type: "control"
        node_name: "{{ item }}"
        ignition: "master"
      ansible.builtin.include_tasks:
        file: ../roles/boot_LPAR/tasks/main.yaml
      loop: "{{ q('list', env.cluster.nodes[node_type].vm_name) | flatten }}"
      # Disabled function
      when: 0

- name: 6 create nodes - create control nodes using KVM
  hosts: kvm_host
  gather_facts: false
  roles:
    - common
    - role: create_control_nodes
      when: env.cluster.nodes.control.vm_name is defined

- name: 6 create nodes - create bootstrap using LPAR boot from ftp
  hosts: localhost
  tasks:
    - name: Boot bootstrap LPAR from ftp
      when: (env.cluster.nodes.bootstrap.lpar_name | default('')) | length > 0
      ansible.builtin.include_role:
        name: boot_lpar_from_ftp
      vars:
        node: "{{ env.cluster.nodes.bootstrap }}"
      # Loop is not really required, because we have only one bootsrap.
      loop: "{{ q('list', env.cluster.nodes.bootstrap.lpar_name) | flatten }}"
      loop_control:
        loop_var: lpar_name
        index_var: idx

- name: 6 create nodes - create control using LPAR boot from ftp
  hosts: localhost
  tasks:
    - name: Boot control LPAR from ftp
      when: (env.cluster.nodes.control.lpar_name | default('')) | length > 0
      ansible.builtin.include_role:
        name: boot_lpar_from_ftp
      vars:
        node: "{{ env.cluster.nodes.control }}"
      loop: "{{ q('list', env.cluster.nodes.control.lpar_name) | flatten }}"
      loop_control:
        loop_var: lpar_name
        index_var: idx

- name: 6 create nodes - wait for bootstrap to connect to control plane
  hosts: bastion
  become: true
  environment:
    KUBECONFIG: "{{ '/home/' if (env.bastion.access.user != 'root') else '/'}}{{ env.bastion.access.user }}/.kube/config"
  gather_facts: true
  roles:
    - wait_for_bootstrap
  tasks:
    - name: Delete haproxy bootstrap entries
      when: env.bastion.options.loadbalancer.on_bastion
      block:
        - name: Delete haproxy bootstrap entries
          ansible.builtin.command: |
            sed -i "/server {{ env.cluster.nodes.bootstrap.hostname }}/d" /etc/haproxy/haproxy.cfg
        - name: Restart haproxy
          ansible.builtin.service:
            name: haproxy.service
            state: restarted
            enabled: true
      ignore_errors: true

- name: 6 create nodes - once bootstrapping is complete, tear down bootstrap.
  hosts: kvm_host_bootstrap
  tags: create_nodes, teardown_bootstrap
  gather_facts: false
  tasks:
    - name: Delete bootstrap volumes and list cluster images
      tags: create_nodes, teardown_bootstrap
      when: env.cluster.nodes.bootstrap.vm_name is defined
      block:
        - name: Delete bootstrap volumes and list cluster images
          tags: create_nodes, teardown_bootstrap
          ansible.builtin.shell: |
            META="{{ env.cluster.networking.metadata_name }}"
            virsh destroy {{ env.cluster.nodes.bootstrap.vm_name }} || true
            virsh undefine {{ env.cluster.nodes.bootstrap.vm_name }} --remove-all-storage --nvram || true
            virsh vol-delete --pool "${META}-vdisk" "{{ env.cluster.nodes.bootstrap.vm_name }}.qcow2" || true
            # Delete 2nd image, if exists
            virsh vol-delete --pool "${META}-vdisk" "{{ env.cluster.nodes.bootstrap.vm_name }}-1.qcow2" || true
            virsh vol-list "${META}-vdisk"
          register: cmd_output

        - name: Debug, print above command output
          tags: create_nodes, teardown_bootstrap
          ansible.builtin.debug:
            var: cmd_output.stdout_lines

- name: 6 create nodes - once bootstrapping is complete, create compute nodes.
  hosts: kvm_host
  tags: create_compute_nodes
  gather_facts: false
  roles:
    - common
    - approve_certs
    - role: create_compute_nodes
      when: env.cluster.nodes.compute.vm_name[0] is defined
#    - role: attach_compute_nodes_disk
#      when: env.cluster.nodes.compute.vm_name[0] is defined

- name: 6 create nodes - create compute nodes using LPAR boot from ftp
  hosts: localhost
  tasks:
    - name: Boot LPAR from ftp
      when: (env.cluster.nodes.compute.lpar_name | default('')) | length > 0
      ansible.builtin.include_role:
        name: boot_lpar_from_ftp
      vars:
        node: "{{ env.cluster.nodes.compute }}"
      loop: "{{ env.cluster.nodes.compute.lpar_name }}"
      loop_control:
        loop_var: lpar_name
        index_var: idx
