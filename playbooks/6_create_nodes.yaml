---
- name: 6 create nodes - find lpar host files
  hosts: localhost
  tasks:
    - name: Check ansible delegate function. It is not always working :-(
      block:
      - name: Test ansible delegate function. It is not always working :-(
        ansible.builtin.shell: |
          hostname
        remote_user: "{{ env.file_server.user }}"
        delegate_to: "{{ env.file_server.ip }}"
