---
# Under development
###################################################################################################
#  To execute this playbook you need to create a node config yaml fiile with these parameters:
# ---
# day2_control_node:
#   host_arch: <node architecture>
#   host_user: <KVM host user which is used to create the VM>
#   hostname: <your VM host name or LPAR hostname>
#   ip: <your VM IP address or LPAR IP>
#   ipv6: <your VM IPv6 address, LPAR does not support ipv6 variable yet>
#   mac:  <your VM MAC address, LPAR does not support mac variable yet>
#   vm_name: <your VM name, otherwise disable>
#   vm_interface: <your VM network interface used for the IP addresses>
#   lpar_name: <your LPAR name, otherwise disable>
#   lpar_prm_config1 <your LPAR prm file config>
#
# Execute the playbook with '--extra-vars' option.
# E.g.:
# ansible-playbook playbooks/add_compute_node.yaml --extra-vars "@extra-cnode1.yml"

- name: Add an additional control node
  # Select bastion host
  hosts: bastion
  gather_facts: false
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
  pre_tasks:
    - name: Check required variables
      when: (day2_control_node is not defined)
      block:
        - name: Check required variables
          ansible.builtin.debug:
            msg:
              - "ERROR: Variable 'day2_control_node' is not defined!"
              - "Execute: 'ansible-playbook playbooks/add_control_node.yaml --extra-vars \"@extra-node.yml\"'"
        - name: Abort playbook
          ansible.builtin.fail:
            msg: "See above error!"

    - name: Get, show and check OCP payload
      block:
        - name: Get OCP payload
          ansible.builtin.shell: |
            set -o pipefail
            oc adm release info -ojson | jq '.metadata.metadata."release.openshift.io/architecture"'
          register: cmd_output

        - name: Show OCP payload
          ansible.builtin.debug:
            var: cmd_output.stdout

        - name: Check for 'multi' payload, fail if not 'multi'
          when: ("multi" not in cmd_output.stdout) and 0
          ansible.builtin.fail:

    - name: Get RHCOS iso download url from machine-config-operator
      ansible.builtin.shell: |
        set -o pipefail
        oc -n openshift-machine-config-operator get configmap/coreos-bootimages -o jsonpath='{.data.stream}' \
        | jq -r '.architectures.{{ day2_control_node.host_arch }}.artifacts.metal.formats.iso.disk.location'
      register: _rhcos_iso_dl_url

    - name: Check variable '_rhcos_iso_dl_url' is not 'null'
      ansible.builtin.fail:
      when: _rhcos_iso_dl_url.stdout == "null"

    - name: Get RHCOS kernel download url from machine-config-operator
      ansible.builtin.shell: |
        set -o pipefail
        oc -n openshift-machine-config-operator get configmap/coreos-bootimages -o jsonpath='{.data.stream}' \
        | jq -r '.architectures.{{ day2_control_node.host_arch }}.artifacts.metal.formats.pxe.kernel.location'
      register: _rhcos_kernel_dl_url

    - name: Get RHCOS initrd download url from machine-config-operator
      ansible.builtin.shell: |
        set -o pipefail
        oc -n openshift-machine-config-operator get configmap/coreos-bootimages -o jsonpath='{.data.stream}' \
        | jq -r '.architectures.{{ day2_control_node.host_arch }}.artifacts.metal.formats.pxe.initramfs.location'
      register: _rhcos_initrd_dl_url

    - name: Get RHCOS rootfs download url from machine-config-operator
      ansible.builtin.shell: |
        set -o pipefail
        oc -n openshift-machine-config-operator get configmap/coreos-bootimages -o jsonpath='{.data.stream}' \
        | jq -r '.architectures.{{ day2_control_node.host_arch }}.artifacts.metal.formats.pxe.rootfs.location'
      register: _rhcos_rootfs_dl_url

    - name: Redefine RHCOS variables
      ansible.builtin.set_fact:
        rhcos_live_kernel: "{{ (_rhcos_kernel_dl_url.stdout | split('/') | last) }}"
        rhcos_live_initrd: "{{ (_rhcos_initrd_dl_url.stdout | split('/') | last) }}"
        rhcos_live_rootfs: "{{ (_rhcos_rootfs_dl_url.stdout | split('/') | last) }}"
        rhcos_live_iso: "{{ (_rhcos_iso_dl_url.stdout.split('/')[-1]) }}"

    - name: Redefine RHCOS download url
      ansible.builtin.set_fact:
        # Assume all images have same download location
        rhcos_download_url: "{{ (_rhcos_rootfs_dl_url.stdout | replace(rhcos_live_rootfs, '')) }}"

    - name: If not available, download Red Hat CoreOS files to HMC ftp server
      when: day2_control_node.lpar_name[0] is defined
      ansible.builtin.get_url:
        url: "{{ item.baseurl }}{{ item.file }}"
        dest: "~/ftp/images/{{ item.file }}"
        mode: "0644"
      loop:
        - { baseurl: "{{ rhcos_download_url }}", file: "{{ rhcos_live_initrd }}" }
        - { baseurl: "{{ rhcos_download_url }}", file: "{{ rhcos_live_kernel }}" }
#       - { baseurl: "{{ rhcos_download_url }}", file: "{{ rhcos_live_iso }}" }
      register: cmd_output
      remote_user: "{{ env.z.hmc_ftp_server.user }}"
      delegate_to: "{{ env.z.hmc_ftp_server.ip }}"

  roles:
    - role: common
#    - role: delete_compute_node
      # Some tasks will be delegated to the bastion host and target KVM host
#      param_compute_node: "{{ day2_control_node }}"
    - role: print_node_status
    - role: update_ignition_files

    - role: dns_update
      when: env.bastion.options.dns is defined and env.bastion.options.dns
      param_dns_cmd: add
      param_dns_hostname: "{{ day2_control_node.hostname }}"
      param_dns_ip: "{{ day2_control_node.ip }}"

    - role: create_control_node
      # Some tasks will be delegated to the bastion host and target KVM host
      param_control_node: "{{ day2_control_node }}"

    - role: approve_certs
    - role: wait_for_node
      wait_for_node_name: "{{ day2_control_node.hostname }}"
    - role: approve_certs
      approve_certs_cleanup: true
    - role: print_node_status

    # - role: haproxy_update
    #   when: env.bastion.options.loadbalancer.on_bastion
    #   param_haproxy_cmd: add
    #   param_haproxy_hostname: "{{ day2_control_node.vm_hostname }}"
    #   param_haproxy_ip: "{{ day2_control_node.vm_ip }}"

    # - role: tune_kvm_domain
    #   when: day2_control_node.vm_name[0] is defined
    #   delegate_to: "{{ day2_control_node.hostname }}"
    #   param_kvm_domain_list:
    #     - "{{ day2_control_node.vm_name }}"
